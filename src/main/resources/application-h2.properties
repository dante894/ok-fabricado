# Perfil "h2": base de datos en memoria, no necesitas instalar MySQL.
# Los datos se borran cada vez que detienes la aplicacion.
spring.datasource.url=jdbc:h2:mem:autenticidad;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
