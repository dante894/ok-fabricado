spring.application.name=autenticidad
server.port=8081

# --- Base de datos MySQL (la misma idea que en biblioteca) ---
# Usuario y clave: por variables de entorno DB_USER / DB_PASSWORD (si no existen, root/root)
spring.datasource.url=jdbc:mysql://localhost:3306/autenticidad?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# Direccion publica que queda escrita DENTRO del QR. Cuando publiques el sistema,
# cambiala por tu dominio real (ej: https://verifica.tumarca.com)
app.base-url=${APP_BASE_URL:http://localhost:8081}
