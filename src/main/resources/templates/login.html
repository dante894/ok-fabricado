<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Ingresar')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main style="max-width:420px">
    <img class="logo medio" th:src="@{/img/logo.png}" alt="OK Fabricado">
    <h1 style="text-align:center">Ingresar</h1>
    <p class="sub" style="text-align:center">Acceso para fábrica, tiendas y administración.</p>
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <form class="panel" th:action="@{/logincheck}" method="post">
        <div class="fila" style="flex-direction:column;align-items:stretch">
            <label>Email <input type="email" name="email" required autofocus></label>
            <label>Contraseña <input type="password" name="password" required></label>
            <button class="btn" type="submit">Entrar</button>
        </div>
    </form>
</main>
</body>
</html>
